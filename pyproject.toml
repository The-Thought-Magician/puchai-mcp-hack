[project]
name = "puchai-mcp-server"
version = "1.0.0"
description = "AI-powered lead generation MCP server for Puch AI hackathon"
authors = [{name = "Puch AI Hackathon Team"}]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastmcp>=0.5.0",
    "httpx>=0.25.0",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "fastapi>=0.104.0",
    "aiofiles>=23.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []
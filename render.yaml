services:
  - type: web
    name: puchai-mcp-server
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PORT
        value: 8080
      - key: SERPER_API_KEY
        fromSecret: SERPER_API_KEY